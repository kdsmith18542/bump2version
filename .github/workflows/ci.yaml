name: CI

on:
  - push
  - pull_request

# Set minimal permissions for security
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # Go build and test for bumpx
  go:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
      - name: Build binary
        run: go build -o bumpx ./cmd/bumpx/
